# Pi capture config. Points at local disk paths on the headless Pi (not
# `archive/` inside the repo, unlike the GitHub Actions stopgap in config.yaml).
#
# Cams: the two Seattle (KING 5) cams were added first to keep developing the
# pipeline while the off-grid Bluewood cams were down (off-season / generator
# not running). The two Bluewood cams (summit, base) are now captured here too
# — added for the Pi hand-off trial, where GitHub Actions (capture/config.yaml)
# captured Bluewood in parallel for ~1-2 weeks so the two sources could be
# compared before the Actions schedule was disabled — see docs/open-questions.md #1.
# That trial is complete; config.yaml now only runs via a manual workflow_dispatch.
# Two North Carolina cams (WLOS-hosted PNG snapshots) were added on top of that
# — Pi-only, no GitHub Actions equivalent. They ran hourly (interval_minutes)
# rather than every 15 min to slow disk growth; capture/main.py enforces the
# per-cam interval itself (single timer, see deploy/pi/), so this is the only
# place the schedule is declared. unca-tower was re-enabled once the Pi moved
# to the 64GB card; nantahala-outdoor-center stays commented out below.
# sea-tac was added at the same time under seattle, also every 15 min. A new
# washington site groups WA cams that aren't Seattle-specific: mount-rainier
# (moved out of seattle) and kalaloch-lodge (Olympic coast), both every 15
# min. Speculative additions while there's card headroom — may get trimmed
# later.
# A new hawaii site adds two Mauna Kea observatory cams, both `type: youtube`
# (capture/fetch.py's fetch_youtube_frame — yt-dlp resolves the watch/channel
# URL to a direct stream URL, then ffmpeg grabs one frame, same as `type:
# stream`). cfht is a fixed watch URL (a long-running 24/7 stream); subaru-
# telescope is also pinned to a specific watch URL — the channel's `/live`
# URL was tried first but proved unreliable, resolving to whatever the
# channel currently features (including archived/non-live videos from other
# telescopes on the same channel) rather than an actual live Subaru feed. If
# this video ID goes stale, re-check the channel for the current live Subaru
# stream and update the pinned ID (see PR discussion 2026-08-06).
# Heavier per-fetch than a plain image GET (yt-dlp resolution + ffmpeg
# decode), so kept at every 15 min for now but worth revisiting if Pi CPU
# load climbs.

archive_dir: /var/lib/timelapse/archive
capture_log: /var/lib/timelapse/capture.log
web_output: /var/lib/timelapse/www/index.html  # status page (web/generate.py)

# Site display order on the status page (web/generate.py); sites not listed
# here (e.g. a decommissioned site whose old frames are still on disk) sort
# after these, alphabetically.
site_order: [bluewood, seattle, washington, hawaii, north-carolina]

cams:
  columbia:
    site: seattle  # frames land under archive/<site>/<cam>/...
    type: image
    url: "https://cdn.tegna-media.com/king/weather/columbia.jpg"
    interval_minutes: 15
  queenanne:
    site: seattle
    type: image
    url: "https://cdn.tegna-media.com/king/weather/queenanne.jpg"
    interval_minutes: 15
  sea-tac:
    site: seattle
    type: image
    url: "https://cdn.tegna-media.com/king/weather/seatac.jpg"
    interval_minutes: 15
  mount-rainier:
    site: washington  # not Seattle-specific; grouped with other WA-wide cams
    type: image
    url: "https://www.nps.gov/webcams-mora/mountain.jpg"
    interval_minutes: 15
  kalaloch-lodge:
    site: washington
    type: image
    url: "https://cs1.pixelcaster.com/dnc-kalaloch/kalaloch.jpg"
    interval_minutes: 15
  summit:
    site: bluewood
    type: image
    url: "https://cameraftpapi.drivehq.com/api/Camera/LastImageaspx/shareID17403860/bwdsummit.jpg?"
    interval_minutes: 15
  base:
    site: bluewood
    type: image
    url: "https://cameraftpapi.drivehq.com/api/Camera/LastImageaspx/shareID17403629/bwdbase.jpg?"
    interval_minutes: 15
  # North Carolina cams disabled 2026-07-25: no time yet to migrate the Pi to
  # the 64GB card, and these were adding to disk pressure. Commented out
  # rather than deleted since we intend to re-enable once the card migration
  # happens. unca-tower re-enabled 2026-07-30 now that the Pi is on the 64GB
  # card; nantahala-outdoor-center still disabled.
  unca-tower:
    site: north-carolina
    type: image
    url: "https://wlos.com/resources/ftptransfer/wlos/maps/Cam%20UNCA%20EcoNet.png"
    interval_minutes: 60
  # nantahala-outdoor-center:
  #   site: north-carolina
  #   type: image
  #   url: "https://wlos.com/resources/ftptransfer/wlos/maps/Cam%20Nantahala%20Outdoor%20Center.png"
  #   interval_minutes: 60
  cfht:
    site: hawaii
    type: youtube
    display_name: "Canada-France-Hawaii Telescope"
    url: "https://www.youtube.com/watch?v=MPokOMJvZ-g"
    interval_minutes: 15
  subaru-telescope:
    site: hawaii
    type: youtube
    display_name: "Subaru Telescope"
    url: "https://www.youtube.com/watch?v=6g4Fh8K-MhY"
    interval_minutes: 15
